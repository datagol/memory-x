[project]
name = "memx"
version = "0.1.0"
description = "Scoped, auditable long-term memory for DataGOL agents"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
memx = "memx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memx", "memx_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls real OpenRouter models (set MEMX_LIVE=1)"]
