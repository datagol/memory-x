[project]
name = "memx"
version = "0.1.0"
description = "Scoped, auditable long-term memory for AI agents, on Postgres"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DataGOL" }]
requires-python = ">=3.11"
keywords = ["agents", "memory", "llm", "postgres", "pgvector", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The library itself: `from memx import Memory`. The HTTP API, the MCP server and PDF reading are extras.
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3.6",
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=2.3,<3"]
pdf = ["pypdf>=5"]
server = ["memx[api,mcp,pdf]"]
dev = ["memx[server]", "pytest>=8", "pytest-asyncio>=1.0", "pytest-cov>=5", "ruff>=0.17"]

[project.urls]
Homepage = "https://github.com/datagol/memory-x"
Issues = "https://github.com/datagol/memory-x/issues"

[project.scripts]
memx = "memx.cli:main"
memx-mcp = "memx_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memx", "memx_api", "memx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls real OpenRouter models (set MEMX_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, BLE blind except (each one in the code says why with a noqa).
select = ["E", "F", "W", "BLE"]
# Line length is not enforced yet: about 80 existing lines run past 120.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"eval/**" = ["E702", "E741"]  # one-off benchmark scripts
"docs/**" = ["E702", "E741"]  # figure scripts

[tool.coverage.run]
source = ["memx", "memx_api", "memx_mcp"]
