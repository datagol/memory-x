# memory-x: Postgres + API/dashboard + background worker + MCP server.
#
#   docker compose up            # dashboard and API on http://localhost:8000, MCP on http://localhost:8100/mcp
#
# Once the API and MCP server answer, the api service prints where everything is and how to connect an MCP client.
# With `up -d`, show it with: docker compose exec api memx banner
#
# Put OPENROUTER_API_KEY in .env (copy .env.example) before or after the first start; without it everything
# starts and says what to set. After editing .env, run `docker compose up -d` again.
#
# Migrations run automatically when the API or worker starts. Data lives in the memx-pg volume;
# `docker compose down` keeps it, `docker compose down -v` deletes it.

name: memory-x

x-memx: &memx
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy

x-memx-env: &memx-env
  MEMX_DSN: postgresql://memx:${POSTGRES_PASSWORD:-memx}@postgres:5432/memx
  # Without a key the API still starts and every page says what to set; the worker waits for it.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: memx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memx}
      POSTGRES_DB: memx
    ports:
      - "127.0.0.1:${MEMX_PG_PORT:-5433}:5432"   # for the memx CLI and psql on this machine
    volumes:
      - memx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memx -d memx"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *memx
    command: ["uvicorn", "memx_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *memx-env
      MEMX_INSERT_MODE: ${MEMX_INSERT_MODE:-queued}
      # For the start-up message: the published addresses, and the MCP server to wait for.
      MEMX_PUBLISH: ${MEMX_PUBLISH:-127.0.0.1:8000}
      MEMX_MCP_PUBLISH: ${MEMX_MCP_PUBLISH:-127.0.0.1:8100}
      MEMX_BANNER: "1"
      MEMX_BANNER_WAIT_FOR: http://mcp:8100/healthz
    ports:
      - "${MEMX_PUBLISH:-127.0.0.1:8000}:8000"   # host[:port] for the dashboard; see .env.example
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3

  worker:
    <<: *memx
    command: ["memx", "worker"]
    environment:
      <<: *memx-env

  # MCP server (streamable HTTP) for Claude Code, Claude Desktop and other MCP clients. Same database and token as
  # the API; inserts are queued for the worker.
  mcp:
    <<: *memx
    command: ["uvicorn", "memx_mcp.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      <<: *memx-env
      MEMX_INSERT_MODE: queued
    ports:
      - "${MEMX_MCP_PUBLISH:-127.0.0.1:8100}:8100"   # host[:port] for MCP clients; see .env.example
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      start_interval: 1s
      retries: 3

volumes:
  memx-pg:
