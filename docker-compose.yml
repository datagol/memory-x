services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memx
      POSTGRES_PASSWORD: memx
      POSTGRES_DB: memx
    ports:
      - "5433:5432"
    volumes:
      - memx-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memx -d memx"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    profiles: ["app"]
    command: ["uvicorn", "memx_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MEMX_DSN: postgresql://memx:memx@postgres:5432/memx
      MEMX_INSERT_MODE: queued
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles: ["app"]
    command: ["memx", "worker"]
    environment:
      MEMX_DSN: postgresql://memx:memx@postgres:5432/memx
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  memx-pg:
