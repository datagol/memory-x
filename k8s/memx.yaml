# memx: API (queued inserts) + worker. Expects the Secret "memx-env" described at the bottom of this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: memx-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: memx:latest
          command: ["memx", "migrate"]
          envFrom: [{ secretRef: { name: memx-env } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memx-api
spec:
  replicas: 2
  selector: { matchLabels: { app: memx-api } }
  template:
    metadata: { labels: { app: memx-api } }
    spec:
      containers:
        - name: api
          image: memx:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: MEMX_INSERT_MODE, value: queued }
          envFrom: [{ secretRef: { name: memx-env } }]
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memx-worker
spec:
  replicas: 2
  selector: { matchLabels: { app: memx-worker } }
  template:
    metadata: { labels: { app: memx-worker } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: memx:latest
          command: ["memx", "worker"]
          env:
            - { name: MEMX_WORKER_CONCURRENCY, value: "4" }
          envFrom: [{ secretRef: { name: memx-env } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: memx-api
spec:
  selector: { app: memx-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
# Create with:
#   kubectl create secret generic memx-env \
#     --from-literal=MEMX_DSN=postgresql://... \
#     --from-literal=OPENROUTER_API_KEY=... \
#     --from-literal=MEMX_API_TOKEN=...
